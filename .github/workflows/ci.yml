name: ETTA checks

on:
  push:
    branches: [main, 'session/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # Temporary S002 lockfile handoff; restore read-only when installed.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve dependencies and lockfile for S002 handoff
        run: npm install --no-audit --no-fund
      - name: Typecheck, physics and protocol tests, production build
        run: npm run check
      - name: Commit generated S002 lockfile to session branch (one-time)
        if: github.event_name == 'push' && github.ref == 'refs/heads/session/S002-body' && success()
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'S002: lock verified npm dependency graph'
            git push origin HEAD:session/S002-body
          fi
