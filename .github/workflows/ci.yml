name: ETTA checks

on:
  push:
    branches: [main, 'session/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (lockfile is S002 objective)
        run: npm install --no-audit --no-fund
      - name: Typecheck, contract tests and production build
        run: npm run check
